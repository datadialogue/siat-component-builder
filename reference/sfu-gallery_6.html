<!--
  SFU AEM image gallery. Large image left, thumbnail grid right.
  ALL STYLING IS INLINE (style="...") because the AEM HTML component drops <style> blocks.
  Wraps to one column automatically on narrow screens (no media queries needed).

  The 9 colored numbered tiles are built-in placeholders for testing.
  TO USE REAL IMAGES, edit each <button class="sfug-thumb">:
    data-full    = large image URL (e.g. /content/dam/yoursite/gallery/photo1.jpg)
    <img src>    = thumbnail URL (can be the same file)
    alt          = description for screen readers (required)
    data-caption = optional caption under the large image
  data-title   = short headline shown at the top of the large image
    data-text    = longer text revealed on hover (the image dims behind it)
  Keep each button's style="..." attributes as they are.
-->
<div class="sfug" data-sfug style="display:flex;flex-flow:row wrap;align-items:flex-start;justify-content:space-between;width:100%;max-width:100%;margin:1.5em 0;box-sizing:border-box;">

  <figure class="sfug-stage" style="flex:1 1 380px;min-width:0;margin:0 0 16px 0;padding:0;background:#f2f2f2;border-radius:6px;overflow:hidden;box-sizing:border-box;">
    <div class="sfug-frame" style="position:relative;display:block;width:100%;height:0;padding-bottom:75%;background:#e6e6e6;overflow:hidden;">
      <img class="sfug-main" src="" alt="" style="position:absolute;top:0;left:0;width:100%;height:100%;max-width:none;margin:0;object-fit:contain;transition:opacity .2s ease, transform .6s ease;">
            <div class="sfug-dim" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000;opacity:0;transition:opacity .45s ease;pointer-events:none;"></div>
      <div class="sfug-shade" style="position:absolute;top:0;left:0;width:100%;height:110px;background:linear-gradient(to bottom,rgba(0,0,0,.65),rgba(0,0,0,0));opacity:1;transition:opacity .45s ease;pointer-events:none;"></div>
      <div class="sfug-over" style="position:absolute;top:16px;left:64px;right:64px;transform:translateY(0);transition:top .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);">
        <div class="sfug-title" style="font-size:1.05em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.2;transition:font-size .5s ease, letter-spacing .5s ease;"></div>
        <div class="sfug-bar" style="width:36px;height:3px;margin:8px 0 0 0;background:#a6192e;transition:width .5s ease, margin .5s ease;"></div>
        <div class="sfug-text" style="max-height:0;opacity:0;overflow:hidden;font-size:1em;line-height:1.5;transition:max-height .5s ease, opacity .5s ease .1s, margin .5s ease;"></div>
      </div>
      <button type="button" class="sfug-prev" aria-label="Previous image" style="position:absolute;top:50%;margin:-20px 0 0 0;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:24px;line-height:40px;text-align:center;cursor:pointer;left:10px;">&#8249;</button>
      <button type="button" class="sfug-next" aria-label="Next image" style="position:absolute;top:50%;margin:-20px 0 0 0;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:24px;line-height:40px;text-align:center;cursor:pointer;right:10px;">&#8250;</button>
    </div>
    <figcaption class="sfug-caption" aria-live="polite" style="display:block;padding:10px 14px;font-size:.95em;line-height:1.4;color:#333;background:#fff;border-top:1px solid #ddd;"></figcaption>
  </figure>

    <button type="button" class="sfug-thumb" style="position:relative;display:block;flex:0 0 31.5%;width:31.5%;height:0;padding:0 0 31.5% 0;margin:0 0 2.75% 0;border:3px solid transparent;border-radius:4px;background:#ddd;overflow:hidden;cursor:pointer;opacity:.75;box-sizing:border-box;" data-full="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23ef6c00'/%3E%3Ctext x='200' y='200' font-size='140' fill='white' text-anchor='middle' font-family='sans-serif'%3E5%3C/text%3E%3C/svg%3E" data-caption="Caption for image 5" data-title="Image 5 headline" data-text="This is the longer description for image 5. It appears when you hover over the picture, and the photo dims behind it so the text is easy to read. Replace this with your own copy."><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23ef6c00'/%3E%3Ctext x='200' y='200' font-size='140' fill='white' text-anchor='middle' font-family='sans-serif'%3E5%3C/text%3E%3C/svg%3E" alt="Describe image 5" style="position:absolute;top:0;left:0;width:100%;height:100%;max-width:none;margin:0;object-fit:cover;display:block;"></button>

  <script>
    (function () {
      function init(root) {
        if (root.sfugReady) return; root.sfugReady = true;
        var main = root.querySelector('.sfug-main');
        var cap = root.querySelector('.sfug-caption');
        var thumbs = Array.prototype.slice.call(root.querySelectorAll('.sfug-thumb'));
        var frame = root.querySelector('.sfug-frame');
        var dim = root.querySelector('.sfug-dim');
        var shade = root.querySelector('.sfug-shade');
        var over = root.querySelector('.sfug-over');
        var title = root.querySelector('.sfug-title');
        var bar = root.querySelector('.sfug-bar');
        var text = root.querySelector('.sfug-text');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { [main, dim, shade, over, title, bar, text].forEach(function (el) { el.style.transition = 'none'; }); }

        // Hover / focus / tap: dim the image and expand the text to the middle
        function setOpen(open) {
          dim.style.opacity = open ? '.62' : '0';
          shade.style.opacity = open ? '0' : '1';
          main.style.transform = (open && !reduce) ? 'scale(1.05)' : 'scale(1)';
          over.style.top = open ? '50%' : '16px';
          over.style.transform = open ? 'translateY(-50%)' : 'translateY(0)';
          title.style.fontSize = open ? '1.7em' : '1.05em';
          title.style.letterSpacing = open ? '.04em' : '.12em';
          bar.style.width = open ? '90px' : '36px';
          bar.style.margin = open ? '12px 0 0 0' : '8px 0 0 0';
          text.style.maxHeight = open ? '220px' : '0';
          text.style.opacity = open ? '1' : '0';
          text.style.margin = open ? '14px 0 0 0' : '0';
        }
        frame.addEventListener('mouseenter', function () { setOpen(true); });
        frame.addEventListener('mouseleave', function () { setOpen(false); });
        frame.addEventListener('focusin', function () { setOpen(true); });
        frame.addEventListener('focusout', function () { setOpen(false); });
        frame.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'touch' && !e.target.closest('button')) { setOpen(dim.style.opacity === '0'); }
        });
        var current = -1;
        if (!thumbs.length) return;

        function show(i, focusThumb) {
          i = (i + thumbs.length) % thumbs.length;
          if (i === current) return;
          current = i;
          var t = thumbs[i];
          var alt = t.querySelector('img').getAttribute('alt') || '';
          thumbs.forEach(function (b, n) {
            var on = n === i;
            b.setAttribute('aria-current', on ? 'true' : 'false');
            b.style.borderColor = on ? '#a6192e' : 'transparent';
            b.style.opacity = on ? '1' : '.75';
          });
          main.style.opacity = '0';
          var next = new Image();
          next.onload = next.onerror = function () {
            if (current !== i) return;
            main.src = t.getAttribute('data-full');
            main.alt = alt;
            main.style.opacity = '1';
          };
          next.src = t.getAttribute('data-full');
          title.textContent = t.getAttribute('data-title') || '';
          text.textContent = t.getAttribute('data-text') || '';
          over.style.visibility = (title.textContent || text.textContent) ? 'visible' : 'hidden';
          cap.textContent = t.getAttribute('data-caption') || '';
          cap.style.display = cap.textContent ? 'block' : 'none';
          if (focusThumb) t.focus();
        }

        thumbs.forEach(function (b, n) {
          b.addEventListener('click', function () { show(n); });
          b.addEventListener('mouseenter', function () { b.style.opacity = '1'; });
          b.addEventListener('mouseleave', function () { b.style.opacity = (n === current) ? '1' : '.75'; });
        });
        root.querySelector('.sfug-prev').addEventListener('click', function () { show(current - 1); });
        root.querySelector('.sfug-next').addEventListener('click', function () { show(current + 1); });
        root.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); show(current + 1, true); }
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); show(current - 1, true); }
        });
        show(0);
      }
      var roots = document.querySelectorAll('[data-sfug]');
      for (var k = 0; k < roots.length; k++) init(roots[k]);
    })();
  </script>
